version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aicte-fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      AICTE_DATABASE_PATH: /data/aicte.sqlite
      DOCUMENT_STORAGE_PATH: /data/documents
      ENVIRONMENT: production
      DOCUMENT_PROCESSOR_TOKEN: ${DOCUMENT_PROCESSOR_TOKEN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_SUBJECT_USER_MAP: "${OIDC_SUBJECT_USER_MAP:-}"
      AICTE_DEMO_ROLE_SWITCH_ENABLED: "false"
    volumes:
      - platform_data:/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicte-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      AICTE_DATABASE_PATH: /data/aicte.sqlite
      DOCUMENT_STORAGE_PATH: /data/documents
      DOCUMENT_PROCESSOR_URL: http://backend:8000
      DOCUMENT_PROCESSOR_TOKEN: ${DOCUMENT_PROCESSOR_TOKEN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_SUBJECT_USER_MAP: "${OIDC_SUBJECT_USER_MAP:-}"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      AICTE_DEMO_ROLE_SWITCH_ENABLED: "false"
    volumes:
      - platform_data:/data
    depends_on:
      - backend

volumes:
  platform_data:
